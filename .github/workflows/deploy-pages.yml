name: Deploy Cyber Cat 2K25 to GitHub Pages

on:
  push:
    branches:
      - cyber-cat-2k25
    paths:
      - "cyber-cat 2k25/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Prepare site and compatibility URLs
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="cyber-cat 2k25"
          OUTPUT="_site"

          test -f "$SOURCE/index.html"
          test -f "$SOURCE/style.css"
          test -f "$SOURCE/script.js"
          test -f "$SOURCE/favicon.svg"
          test -f "$SOURCE/assets/sounds/cat-roar.mp3"

          # Publish the canonical URL at the project root.
          mkdir -p "$OUTPUT"
          cp -R "$SOURCE/." "$OUTPUT/"

          # Preserve the old path with a literal space.
          mkdir -p "$OUTPUT/cyber-cat 2k25"
          cp -R "$SOURCE/." "$OUTPUT/cyber-cat 2k25/"

          # Also preserve a literal percent-encoded path for URL routers
          # that resolve "%20" without decoding it before file lookup.
          mkdir -p "$OUTPUT/cyber-cat%202k25"
          cp -R "$SOURCE/." "$OUTPUT/cyber-cat%202k25/"

          # Tell Pages not to run Jekyll over the static output.
          touch "$OUTPUT/.nojekyll"
          touch "$OUTPUT/cyber-cat 2k25/.nojekyll"
          touch "$OUTPUT/cyber-cat%202k25/.nojekyll"

          # Fail the build unless all entry points and local assets exist.
          test -f "$OUTPUT/index.html"
          test -f "$OUTPUT/style.css"
          test -f "$OUTPUT/script.js"
          test -f "$OUTPUT/cyber-cat 2k25/index.html"
          test -f "$OUTPUT/cyber-cat 2k25/style.css"
          test -f "$OUTPUT/cyber-cat 2k25/script.js"
          test -f "$OUTPUT/cyber-cat%202k25/index.html"
          test -f "$OUTPUT/cyber-cat%202k25/style.css"
          test -f "$OUTPUT/cyber-cat%202k25/script.js"

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "_site"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
