name: Deploy Cyber Cat 2K25 to GitHub Pages

on:
  push:
    branches:
      - cyber-cat-2k25
    paths:
      - "cyber-cat 2k25/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Prepare static site
        run: |
          test -f "cyber-cat 2k25/index.html"
          test -f "cyber-cat 2k25/style.css"
          test -f "cyber-cat 2k25/script.js"
          test -f "cyber-cat 2k25/favicon.svg"
          test -f "cyber-cat 2k25/assets/sounds/cat-roar.mp3"
          touch "cyber-cat 2k25/.nojekyll"

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "cyber-cat 2k25"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
