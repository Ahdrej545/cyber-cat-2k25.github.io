name: Static site checks

on:
  pull_request:
    branches:
      - cyber-cat-2k25
  push:
    branches:
      - cyber-cat-2k25
      - feature/cyber-cat-2k25-v2
      - feature/cyber-cat-2k25-v1.1
      - feature/cyber-cat-2k25-v1.2
      - feature/cyber-cat-2k25-v1.3
      - feature/cyber-cat-2k25-v1.4
      - feature/cyber-cat-2k25-v1.5
      - feature/cyber-cat-2k25-v1.6-gallery
      - feature/cyber-cat-2k25-v1.7-saved-gallery
      - feature/cyber-cat-2k25-v1.8-gallery-backup
      - feature/cyber-cat-2k25-v1.9-native-meme-sharing
      - feature/cyber-cat-2k25-v2-pwa-offline
      - feature/cyber-cat-2k25-v2.0.1-pwa-install-fix

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check JavaScript syntax
        run: |
          node --check "cyber-cat 2k25/script.js"
          node --check "cyber-cat 2k25/sw.js"
      - name: Verify local page assets
        shell: bash
        run: |
          test -f "cyber-cat 2k25/index.html"
          test -f "cyber-cat 2k25/style.css"
          test -f "cyber-cat 2k25/script.js"
          test -f "cyber-cat 2k25/favicon.svg"
          test -f "cyber-cat 2k25/site.webmanifest"
          test -f "cyber-cat 2k25/sw.js"
          test -f "cyber-cat 2k25/app-icon-192.png"
          test -f "cyber-cat 2k25/app-icon-512.png"
          test -f "cyber-cat 2k25/assets/sounds/cat-roar.mp3"
      - name: Validate PNG app icons
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib
          import struct
          import zlib

          root = pathlib.Path("cyber-cat 2k25")
          expected = {"app-icon-192.png": (192, 192), "app-icon-512.png": (512, 512)}
          signature = b"\x89PNG\r\n\x1a\n"
          for filename, dimensions in expected.items():
              data = (root / filename).read_bytes()
              if not data.startswith(signature):
                  raise SystemExit(f"FAIL: {filename} is not a PNG")
              offset = 8
              got_dimensions = None
              found_iend = False
              found_idat = False
              while offset + 12 <= len(data):
                  length = struct.unpack_from(">I", data, offset)[0]
                  kind = data[offset + 4:offset + 8]
                  end = offset + 12 + length
                  if end > len(data):
                      raise SystemExit(f"FAIL: {filename} has a truncated {kind!r} chunk")
                  payload = data[offset + 8:offset + 8 + length]
                  expected_crc = struct.unpack_from(">I", data, offset + 8 + length)[0]
                  if zlib.crc32(kind + payload) & 0xffffffff != expected_crc:
                      raise SystemExit(f"FAIL: {filename} has an invalid CRC in {kind.decode('ascii', 'replace')}")
                  if kind == b"IHDR":
                      got_dimensions = struct.unpack_from(">II", payload, 0)
                  elif kind == b"IDAT":
                      found_idat = True
                  elif kind == b"IEND":
                      found_iend = True
                      if end != len(data):
                          raise SystemExit(f"FAIL: {filename} has bytes after IEND")
                      break
                  offset = end
              if got_dimensions != dimensions or not found_idat or not found_iend:
                  raise SystemExit(f"FAIL: {filename} has invalid structure or dimensions")
              print(f"PASS: {filename} is a valid {dimensions[0]}x{dimensions[1]} PNG with all CRCs verified")
          PY
      - name: Validate page structure and interactive controls
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const root = 'cyber-cat 2k25/';
          const html = fs.readFileSync(root + 'index.html', 'utf8');
          const js = fs.readFileSync(root + 'script.js', 'utf8');

          let failed = false;
          function check(condition, message) {
            console.log(`${condition ? 'PASS' : 'FAIL'}: ${message}`);
            if (!condition) failed = true;
          }

          const ids = [...html.matchAll(/\bid=["']([^"']+)["']/g)].map((m) => m[1]);
          const idSet = new Set(ids);
          const duplicateIds = ids.filter((id, index) => ids.indexOf(id) !== index);
          check(duplicateIds.length === 0, 'HTML has no duplicate IDs');

          const anchors = [...html.matchAll(/\bhref=["']#([^"']+)["']/g)].map((m) => m[1]);
          const missingAnchors = [...new Set(anchors.filter((id) => !idSet.has(id)))];
          check(missingAnchors.length === 0, 'all internal links point to existing IDs' +
            (missingAnchors.length ? ': ' + missingAnchors.join(', ') : ''));

          const controls = [...html.matchAll(/\baria-controls=["']([^"']+)["']/g)].map((m) => m[1]);
          check(controls.every((id) => idSet.has(id)), 'ARIA controls refer to existing elements');

          const jsSelectors = [...js.matchAll(/\$\(["']#([\w-]+)/g)].map((m) => m[1]);
          const missingSelectors = [...new Set(jsSelectors.filter((id) => !idSet.has(id)))];
          check(missingSelectors.length === 0, 'JavaScript ID selectors exist in the page' +
            (missingSelectors.length ? ': ' + missingSelectors.join(', ') : ''));

          const commandBlock = js.match(/const commands=\{([\s\S]*?)\n\};/);
          const commandNames = commandBlock
            ? [...commandBlock[1].matchAll(/(?:^|,|\n)\s*([a-z]+):\(\)=>/g)].map((m) => m[1])
            : [];
          const quickCommands = [...html.matchAll(/data-command=["']([^"']+)["']/g)].map((m) => m[1]);
          check(commandNames.length > 0, 'terminal command table exists');
          check(quickCommands.every((name) => commandNames.includes(name)),
            'quick-command buttons map to implemented terminal commands');

          const nodeBlock = js.match(/const nodeData=\{([\s\S]*?)\};/);
          const nodeDataNames = nodeBlock
            ? [...nodeBlock[1].matchAll(/(?:^|,)\s*([a-z]+):\{/g)].map((m) => m[1])
            : [];
          const nodes = [...html.matchAll(/data-node=["']([^"']+)["']/g)].map((m) => m[1]);
          check(nodes.length > 0 && nodes.every((name) => nodeDataNames.includes(name)),
            'every network node has matching detail data');
          check(nodeDataNames.every((name) => nodes.includes(name)),
            'every network detail entry has a matching node button');

          check(html.includes('href="style.css?v=2.0.1"'), 'page links v2.0.1 versioned stylesheet to bust stale caches');
          check(html.includes('src="script.js?v=2.0.1"'), 'page links v2.0.1 versioned JavaScript to bust stale caches');

          let manifest = null;
          try { manifest = JSON.parse(fs.readFileSync(root + 'site.webmanifest', 'utf8')); }
          catch (error) { check(false, 'PWA web manifest is valid JSON'); }
          check(html.includes('<link rel="manifest" href="site.webmanifest">'),
            'page links to the installable PWA manifest');
          check(manifest && manifest.name === 'Cyber Cat 2K25' && manifest.start_url === './index.html' &&
            manifest.scope === './' && manifest.display === 'standalone',
            'PWA manifest has name, scoped start URL and standalone display');
          check(manifest && [192, 512].every(size => manifest.icons.some(icon =>
            icon.sizes === `${size}x${size}` && icon.type === 'image/png')),
            'PWA manifest includes standard 192px and 512px PNG icons');
          check(['install-app', 'pwa-status'].every(id => idSet.has(id)),
            'PWA install button and accessible status message exist');
          check(js.includes('beforeinstallprompt') && js.includes('navigator.serviceWorker.register("./sw.js"'),
            'PWA install prompt and service worker registration are wired');
          const sw = fs.readFileSync(root + 'sw.js', 'utf8');
          check(sw.includes('CACHE_NAME') && sw.includes('cache.addAll') && sw.includes('skipWaiting') &&
            sw.includes('clients.claim') && sw.includes('event.respondWith'),
            'service worker precaches app shell and handles offline requests');
          check(js.includes('getManualPwaInstallHelp') && js.includes('На Android') && js.includes('iPhone/iPad'),
            'install button explains browser-specific manual installation paths');
          check(js.includes('worker.state==="activated"') && js.includes('worker.state==="redundant"'),
            'offline status waits for service worker activation and reports install failures');

          const generatorIds = ['meme-generator', 'meme-context', 'meme-result',
            'meme-caption', 'generate-meme', 'copy-meme', 'share-meme'];
          check(generatorIds.every((id) => idSet.has(id)),
            'reaction generator has all expected interactive elements');
          check(/const memeOptions=\{/.test(js),
            'reaction generator data exists');
          check(/navigator\.share/.test(js),
            'sharing uses the native share sheet when available');
          check(/copyToClipboard/.test(js),
            'copy/share includes a clipboard compatibility fallback');

          const libraryIds = ['favorite-meme', 'meme-history-list', 'meme-favorites-list',
            'meme-history-count', 'meme-favorites-count', 'clear-meme-history'];
          check(libraryIds.every((id) => idSet.has(id)),
            'reaction history and favourites have all expected controls');
          check(/localStorage\.getItem/.test(js) && /localStorage\.setItem/.test(js),
            'reaction history and favourites persist locally');
          check(/MAX_MEME_HISTORY=8/.test(js) && /MAX_MEME_FAVORITES=20/.test(js),
            'saved reaction lists have explicit size limits');
          check(/data-reaction-action/.test(js) && /restoreReaction/.test(js),
            'saved reactions can be restored from the lists');

          const customReactionIds = ['custom-reaction-panel', 'custom-reaction-form',
            'custom-reaction-text', 'custom-reaction-context', 'custom-reaction-counter',
            'custom-reaction-list', 'custom-reaction-count', 'save-custom-reaction'];
          check(customReactionIds.every((id) => idSet.has(id)),
            'custom reaction editor has all required controls');
          check(/MAX_CUSTOM_REACTIONS=30/.test(js) && /MAX_CUSTOM_REACTION_LENGTH=240/.test(js),
            'custom reactions have explicit list and text-length limits');
          check(/data-custom-reaction-action/.test(js) && /readCustomReactions/.test(js),
            'custom reactions can be restored, removed, and loaded');

          const transferIds = ['collection-transfer', 'collection-transfer-title',
            'export-meme-collections', 'import-meme-collections', 'collection-transfer-status'];
          check(transferIds.every((id) => idSet.has(id)),
            'collection export/import UI has all expected controls');
          check(js.includes('COLLECTION_EXPORT_FORMAT') && js.includes('COLLECTION_EXPORT_VERSION=1'),
            'collection backup uses an explicit versioned JSON format');
          check(js.includes('URL.createObjectURL') && js.includes('await file.text()'),
            'collection export creates a file and import reads a selected file');
          check(js.includes('MAX_IMPORT_FILE_SIZE=100*1024') && js.includes('parsed.format!==COLLECTION_EXPORT_FORMAT'),
            'collection import validates file size and backup format');
          check(js.includes('mergeReactionLists') && js.includes('renderCustomReactions'),
            'collection import merges validated items and refreshes the custom collection');

          const memeStudioIds = ['meme-studio', 'meme-template', 'meme-image-upload',
            'meme-image-top-text', 'meme-image-bottom-text', 'meme-image-canvas',
            'download-meme-png', 'share-meme-png', 'reset-meme-image', 'use-current-reaction', 'meme-studio-status'];
          check(memeStudioIds.every((id) => idSet.has(id)),
            'meme studio has all expected editor and preview controls');
          check(/width="1200" height="1200"/.test(html),
            'meme canvas exports at 1200 by 1200 pixels');
          check(js.includes('memeStudioCanvas.toBlob') && js.includes('"image/png"'),
            'meme studio downloads a rendered PNG');
          check(js.includes('sharePngBlobOrDownload') && js.includes('navigator.canShare') && js.includes('navigator.share'),
            'meme PNG sharing uses the native share sheet with a download fallback');
          check(js.includes('MEME_IMAGE_MAX_FILE_SIZE=8*1024*1024') && js.includes('file.type') && js.includes('file.size>MEME_IMAGE_MAX_FILE_SIZE'),
            'uploaded images are type-checked and limited to 8 MB');
          check(js.includes('useCurrentReactionButton') && js.includes('memeResult?.textContent'),
            'current generated reactions can be inserted into the image caption');
          check(js.includes('URL.createObjectURL(file)') && js.includes('URL.revokeObjectURL'),
            'uploaded image URLs are local and released when no longer needed');

          const galleryIds = ['meme-template-gallery-title', 'meme-gallery-grid'];
          const galleryControls = ['meme-gallery-filter', 'meme-gallery-card'];
          check(galleryIds.every((id) => idSet.has(id)),
            'ready-made meme gallery has its heading and card grid');
          check(galleryControls.every((name) => html.includes(name)),
            'gallery includes template cards and category filters');
          check((html.match(/data-gallery-preset=/g) || []).length >= 6,
            'gallery includes at least six ready-made templates');
          check(js.includes('memeGalleryPresets') && js.includes('selectMemeGalleryPreset'),
            'gallery presets can be applied to the meme editor');
          check(html.includes('data-gallery-filter') && js.includes('memeGalleryFilters.forEach'),
            'gallery category filters are wired to the interface');
          check(js.includes('motif==="cat"') && js.includes('motif:"cat"'),
            'cyber cat background motif is implemented');

          const savedGalleryIds = ['save-meme-to-gallery', 'saved-meme-gallery',
            'saved-meme-gallery-title', 'saved-meme-gallery-count', 'saved-meme-gallery-status',
            'saved-meme-gallery-grid', 'refresh-saved-memes', 'export-saved-memes-zip', 'import-saved-memes-zip'];
          check(savedGalleryIds.every((id) => idSet.has(id)),
            'saved meme gallery has all expected controls and regions');
          check(js.includes('indexedDB.open(SAVED_MEMES_DB_NAME') && js.includes('createObjectStore(SAVED_MEMES_STORE'),
            'saved meme gallery persists in IndexedDB');
          check(js.includes('MAX_SAVED_MEMES=20') && js.includes('MAX_SAVED_MEME_SIZE=12*1024*1024'),
            'saved gallery has collection and per-image size limits');
          check(js.includes('memeStudioCanvas.toBlob') && js.includes('saveMemeRecord(record)'),
            'current canvas PNG can be saved into the gallery');
          check(js.includes('createSavedMemeButton("Скачать PNG ↓","download"') && js.includes('createSavedMemeButton("Удалить ×","delete"'),
            'saved memes can be downloaded and removed');
          check(js.includes('createSavedMemeButton("Поделиться ↗","share"') && js.includes('button.dataset.savedMemeAction==="share"'),
            'saved memes can be shared from the local gallery');
          check(js.includes('renderSavedMemeRecords') && js.includes('URL.createObjectURL(record.blob)'),
            'saved gallery renders local image thumbnails');
          check(js.includes('createSavedMemeGalleryZip') && js.includes('readSavedMemeGalleryZip'),
            'saved gallery supports ZIP export and validated ZIP restore');
          check(js.includes('zipCRC32') && js.includes('application/zip') && js.includes('cyber-cat-2k25-gallery'),
            'ZIP backup has CRC validation and an explicit versioned local format');
          check(js.includes('replaceSavedMemeGalleryRecords') && js.includes('window.confirm'),
            'gallery restore confirms before replacing the current local collection');

          if (failed) process.exit(1);
          NODE
