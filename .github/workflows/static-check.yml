name: Static site checks

on:
  pull_request:
    branches:
      - cyber-cat-2k25
  push:
    branches:
      - cyber-cat-2k25
      - feature/cyber-cat-2k25-v2
      - feature/cyber-cat-2k25-v1.1
      - feature/cyber-cat-2k25-v1.2
      - feature/cyber-cat-2k25-v1.3
      - feature/cyber-cat-2k25-v1.4
      - feature/cyber-cat-2k25-v1.5

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check JavaScript syntax
        run: node --check "cyber-cat 2k25/script.js"
      - name: Verify local page assets
        shell: bash
        run: |
          test -f "cyber-cat 2k25/index.html"
          test -f "cyber-cat 2k25/style.css"
          test -f "cyber-cat 2k25/script.js"
          test -f "cyber-cat 2k25/favicon.svg"
          test -f "cyber-cat 2k25/assets/sounds/cat-roar.mp3"
      - name: Validate page structure and interactive controls
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const root = 'cyber-cat 2k25/';
          const html = fs.readFileSync(root + 'index.html', 'utf8');
          const js = fs.readFileSync(root + 'script.js', 'utf8');

          let failed = false;
          function check(condition, message) {
            console.log(`${condition ? 'PASS' : 'FAIL'}: ${message}`);
            if (!condition) failed = true;
          }

          const ids = [...html.matchAll(/\bid=["']([^"']+)["']/g)].map((m) => m[1]);
          const idSet = new Set(ids);
          const duplicateIds = ids.filter((id, index) => ids.indexOf(id) !== index);
          check(duplicateIds.length === 0, 'HTML has no duplicate IDs');

          const anchors = [...html.matchAll(/\bhref=["']#([^"']+)["']/g)].map((m) => m[1]);
          const missingAnchors = [...new Set(anchors.filter((id) => !idSet.has(id)))];
          check(missingAnchors.length === 0, 'all internal links point to existing IDs' +
            (missingAnchors.length ? ': ' + missingAnchors.join(', ') : ''));

          const controls = [...html.matchAll(/\baria-controls=["']([^"']+)["']/g)].map((m) => m[1]);
          check(controls.every((id) => idSet.has(id)), 'ARIA controls refer to existing elements');

          const jsSelectors = [...js.matchAll(/\$\(["']#([\w-]+)/g)].map((m) => m[1]);
          const missingSelectors = [...new Set(jsSelectors.filter((id) => !idSet.has(id)))];
          check(missingSelectors.length === 0, 'JavaScript ID selectors exist in the page' +
            (missingSelectors.length ? ': ' + missingSelectors.join(', ') : ''));

          const commandBlock = js.match(/const commands=\{([\s\S]*?)\n\};/);
          const commandNames = commandBlock
            ? [...commandBlock[1].matchAll(/(?:^|,|\n)\s*([a-z]+):\(\)=>/g)].map((m) => m[1])
            : [];
          const quickCommands = [...html.matchAll(/data-command=["']([^"']+)["']/g)].map((m) => m[1]);
          check(commandNames.length > 0, 'terminal command table exists');
          check(quickCommands.every((name) => commandNames.includes(name)),
            'quick-command buttons map to implemented terminal commands');

          const nodeBlock = js.match(/const nodeData=\{([\s\S]*?)\};/);
          const nodeDataNames = nodeBlock
            ? [...nodeBlock[1].matchAll(/(?:^|,)\s*([a-z]+):\{/g)].map((m) => m[1])
            : [];
          const nodes = [...html.matchAll(/data-node=["']([^"']+)["']/g)].map((m) => m[1]);
          check(nodes.length > 0 && nodes.every((name) => nodeDataNames.includes(name)),
            'every network node has matching detail data');
          check(nodeDataNames.every((name) => nodes.includes(name)),
            'every network detail entry has a matching node button');

          check(/href=["']style\.css["']/.test(html), 'page links its stylesheet');
          check(/src=["']script\.js["']/.test(html), 'page links its JavaScript');

          const generatorIds = ['meme-generator', 'meme-context', 'meme-result',
            'meme-caption', 'generate-meme', 'copy-meme', 'share-meme'];
          check(generatorIds.every((id) => idSet.has(id)),
            'reaction generator has all expected interactive elements');
          check(/const memeOptions=\{/.test(js),
            'reaction generator data exists');
          check(/navigator\.share/.test(js),
            'sharing uses the native share sheet when available');
          check(/copyToClipboard/.test(js),
            'copy/share includes a clipboard compatibility fallback');

          const libraryIds = ['favorite-meme', 'meme-history-list', 'meme-favorites-list',
            'meme-history-count', 'meme-favorites-count', 'clear-meme-history'];
          check(libraryIds.every((id) => idSet.has(id)),
            'reaction history and favourites have all expected controls');
          check(/localStorage\.getItem/.test(js) && /localStorage\.setItem/.test(js),
            'reaction history and favourites persist locally');
          check(/MAX_MEME_HISTORY=8/.test(js) && /MAX_MEME_FAVORITES=20/.test(js),
            'saved reaction lists have explicit size limits');
          check(/data-reaction-action/.test(js) && /restoreReaction/.test(js),
            'saved reactions can be restored from the lists');

          const customReactionIds = ['custom-reaction-panel', 'custom-reaction-form',
            'custom-reaction-text', 'custom-reaction-context', 'custom-reaction-counter',
            'custom-reaction-list', 'custom-reaction-count', 'save-custom-reaction'];
          check(customReactionIds.every((id) => idSet.has(id)),
            'custom reaction editor has all required controls');
          check(/MAX_CUSTOM_REACTIONS=30/.test(js) && /MAX_CUSTOM_REACTION_LENGTH=240/.test(js),
            'custom reactions have explicit list and text-length limits');
          check(/data-custom-reaction-action/.test(js) && /readCustomReactions/.test(js),
            'custom reactions can be restored, removed, and loaded');

          const transferIds = ['collection-transfer', 'collection-transfer-title',
            'export-meme-collections', 'import-meme-collections', 'collection-transfer-status'];
          check(transferIds.every((id) => idSet.has(id)),
            'collection export/import UI has all expected controls');
          check(js.includes('COLLECTION_EXPORT_FORMAT') && js.includes('COLLECTION_EXPORT_VERSION=1'),
            'collection backup uses an explicit versioned JSON format');
          check(js.includes('URL.createObjectURL') && js.includes('await file.text()'),
            'collection export creates a file and import reads a selected file');
          check(js.includes('MAX_IMPORT_FILE_SIZE=100*1024') && js.includes('parsed.format!==COLLECTION_EXPORT_FORMAT'),
            'collection import validates file size and backup format');
          check(js.includes('mergeReactionLists') && js.includes('renderCustomReactions'),
            'collection import merges validated items and refreshes the custom collection');

          if (failed) process.exit(1);
          NODE
