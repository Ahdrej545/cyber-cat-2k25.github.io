<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b14">
  <title>Страница не найдена — Cyber Cat 2K25</title>
  <style>
    :root{color-scheme:dark;--bg:#080b14;--panel:#111827;--cyan:#4df5e8;--pink:#ff4fd8;--text:#edf7ff;--muted:#9eb0c6}
    *{box-sizing:border-box}
    body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 0%,#18233b 0,transparent 55%),var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
    main{width:min(100%,640px);padding:clamp(24px,6vw,48px);border:1px solid #31435c;border-radius:24px;background:rgba(17,24,39,.88);box-shadow:0 0 60px #4df5e817}
    .code{margin:0;color:var(--cyan);font-size:clamp(64px,15vw,104px);font-weight:850;letter-spacing:-.07em;line-height:1}
    h1{margin:16px 0 8px;font-size:clamp(24px,5vw,36px);line-height:1.15}
    p{color:var(--muted)}
    a{display:inline-block;margin-top:16px;padding:12px 18px;border-radius:12px;background:var(--cyan);color:#06101b;font-weight:750;text-decoration:none}
    a:focus-visible{outline:3px solid var(--pink);outline-offset:4px}
  </style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>Эта страница потерялась в сети.</h1>
    <p id="message">Сейчас проверим старый адрес Cyber Cat и попробуем открыть рабочую главную страницу.</p>
    <a id="home-link" href="/cyber-cat-2k25.github.io/">Открыть Cyber Cat 2K25</a>
  </main>
  <script>
    (() => {
      let path = window.location.pathname;
      try { path = decodeURIComponent(path); } catch (_) {}
      // Recover old bookmarks that used the folder name containing a space
      // or the literal "%20" path segment.
      if (/\/cyber-cat(?: 2k25|%202k25)\//i.test(path)) {
        const target = new URL('/cyber-cat-2k25.github.io/', window.location.origin);
        window.location.replace(target.href);
        return;
      }
      const message = document.getElementById('message');
      if (message) message.textContent = 'Проверь адрес или вернись на главную страницу проекта.';
    })();
  </script>
</body>
</html>
